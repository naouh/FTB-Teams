plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}" apply(false)
}

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

base {
	archivesName = archives_base_name
}

// ultimateneo: FTB's shared build scripts (mods-meta v1), vendored so the build
// does not depend on network access; publishing / changelog / CurseForge upload removed.
apply from: rootProject.file('gradle/ftb-meta/maven.gradle')
apply from: rootProject.file('gradle/ftb-meta/utils.gradle')

allprojects {
	apply plugin: 'idea'
	apply plugin: 'java-library'
	apply plugin: 'maven-publish'

	version = createModVersion(project)
	group = project.maven_group

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 25
	}

	java {
		toolchain.languageVersion = JavaLanguageVersion.of(25)
		withSourcesJar()
	}
}

subprojects {
	base {
		archivesName = rootProject.base.archivesName.get() + (project.name != "common" ? "-" + project.name : "")
	}

	if (project.name != "common") {
		dependencies {
			api project(":common")
		}

		jar {
			from project(":common").sourceSets.main.output
		}
	}

	repositories {
		// local FTB Library build first
		mavenLocal()
		mavenCentral()
		commonMavenRepos(repositories)
	}

	processResources {
		exclude '.cache'

		inputs.property "version", project.version

		filesMatching(["META-INF/neoforge.mods.toml"]) {
			expand "version": project.version,
					"neoforge_version_range": neoforge_version_range,
					"neoforge_loader_version": neoforge_loader_version,
					"minecraft_version_range_maven": minecraft_version_range_maven,
					"ftb_library_version_range_maven": ftb_library_version_range_maven
		}
	}

	// Local-only publishing (publishToMavenLocal); no remote repositories are configured.
	publishing {
		publications {
			register("mavenJava${project.name}", MavenPublication) {
				from project.components.java
				artifactId = rootProject.base.archivesName.get() + (project.name != "common" ? "-" + project.name : "")
			}
		}
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
